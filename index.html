<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admin Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f0f4f8; }
        .sidebar { width: 250px; background-color: #1a252f; color: white; padding-top: 20px; }
        .sidebar h2 { text-align: center; font-size: 20px; padding-bottom: 15px; border-bottom: 1px solid #2c3e50; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { padding: 15px; cursor: pointer; border-bottom: 1px solid #2c3e50; }
        .sidebar ul li:hover, .sidebar ul li.active { background-color: #2980b9; border-left: 5px solid #3498db; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .section { display: none; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .section.active { display: block; }
        input, select, button { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #2980b9; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1c5980; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .status-card { background: #e8f8f5; border: 1px solid #1abc9c; padding: 20px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Portal</h2>
        <ul>
            <li class="active" onclick="switchTab('upload')">1. Upload Marksheets</li>
            <li onclick="switchTab('student')">2. Marksheet Collection & Proofs</li>
        </ul>
    </div>

    <div class="main-content">
        <!-- 1. UPLOAD SECTION -->
        <div id="upload" class="section active">
            <h2>Cloud OCR: Extract Marksheets</h2>
            <input type="file" id="pdfFile" accept="application/pdf">
            <button id="uploadBtn" onclick="uploadPDF()">Upload & Process</button>
            <div id="upload-msg" style="margin-top: 15px; font-weight: bold;"></div>
        </div>

        <!-- 2. STUDENT SEARCH & POST-GRAD UPDATE -->
        <div id="student" class="section">
            <h2>Search Student & Update File</h2>
            <input type="text" id="regNo" placeholder="Enter Registration Number...">
            <button onclick="fetchStudent()">Search Database</button>
            
            <div id="result-area" style="display: none; margin-top: 20px;">
                <h2 id="s-name" style="color: #2c3e50; border-bottom: 2px solid #2980b9; padding-bottom: 5px;"></h2>
                
                <div class="info-grid">
                    <div><b>Reg No:</b> <span id="s-reg"></span></div>
                    <div><b>Roll No:</b> <span id="s-roll"></span></div>
                    <div><b>Date Collected:</b> <span id="s-date" style="color:red; font-weight:bold;"></span></div>
                    <div><b>Career Status:</b> <span id="s-status"></span></div>
                    <div><b>Proof File:</b> <span id="s-proof"></span></div>
                </div>

                <!-- UPDATE FORM -->
                <div class="status-card">
                    <h3 style="margin-top:0; color:#16a085;">Issue Marksheet & Register Career Profile</h3>
                    
                    <label><b>1. Date Marksheet Handed Over:</b></label>
                    <input type="date" id="collectionDate">

                    <label><b>2. Current Career Status:</b></label>
                    <select id="postGradStatus">
                        <option value="Job">Employed (Job)</option>
                        <option value="Higher Study">Higher Education (M.A, M.Sc, etc.)</option>
                        <option value="Business">Business / Entrepreneur</option>
                        <option value="Looking">Looking for Opportunities</option>
                    </select>

                    <label><b>3. Details (Company/University Name):</b></label>
                    <input type="text" id="postGradDetails" placeholder="e.g. Wipro / Calcutta University">

                    <label><b>4. Upload Proof (Offer Letter, ID Card, Admission Receipt):</b></label>
                    <input type="file" id="proofFile" accept="image/*,application/pdf">

                    <button onclick="updateStatus()" style="background-color: #1abc9c;">Save Record</button>
                    <div id="status-msg" style="margin-top: 10px; font-weight: bold;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.sidebar ul li').forEach(li => li.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function uploadPDF() {
            const file = document.getElementById("pdfFile").files[0];
            if (!file) return alert("Select a PDF first.");
            
            const btn = document.getElementById("uploadBtn");
            const msg = document.getElementById("upload-msg");
            btn.innerText = "Processing in Cloud... Please wait";
            msg.innerText = "Extracting details... (This may take a few minutes)";
            msg.style.color = "#d35400";
            
            const formData = new FormData();
            formData.append("file", file);

            try {
                const res = await fetch(`/api/admin/upload-marksheet`, { method: "POST", body: formData });
                const data = await res.json();
                msg.innerText = data.message;
                msg.style.color = "green";
            } catch (err) {
                msg.innerText = "Error extracting PDF.";
                msg.style.color = "red";
            } finally {
                btn.innerText = "Upload & Process";
            }
        }

        let currentRegNo = "";
        async function fetchStudent() {
            const regNo = document.getElementById("regNo").value.trim();
            document.getElementById("status-msg").innerText = "";
            try {
                const res = await fetch(`/api/student/${regNo}`);
                if (!res.ok) throw new Error("Student not found.");
                const data = await res.json();
                currentRegNo = data.reg_no;

                document.getElementById("s-name").innerText = data.name;
                document.getElementById("s-reg").innerText = data.reg_no;
                document.getElementById("s-roll").innerText = data.roll_no;
                document.getElementById("s-date").innerText = data.collection_date;
                document.getElementById("s-status").innerText = data.status + (data.details ? ` (${data.details})` : "");
                
                if (data.proof) {
                    document.getElementById("s-proof").innerHTML = `<a href="/${data.proof}" target="_blank">View Proof File</a>`;
                } else {
                    document.getElementById("s-proof").innerText = "No file uploaded.";
                }

                document.getElementById("result-area").style.display = "block";
            } catch (err) {
                alert(err.message);
            }
        }

        async function updateStatus() {
            if (!currentRegNo) return;
            const date = document.getElementById("collectionDate").value;
            const status = document.getElementById("postGradStatus").value;
            const details = document.getElementById("postGradDetails").value;
            const file = document.getElementById("proofFile").files[0];
            const msg = document.getElementById("status-msg");

            if (!date) return alert("Please select the Date the marksheet was collected.");

            const formData = new FormData();
            formData.append("collection_date", date);
            formData.append("status", status);
            formData.append("details", details);
            if (file) formData.append("proof_file", file);

            msg.innerText = "Saving to Database...";
            
            try {
                const res = await fetch(`/api/admin/update-status/${currentRegNo}`, { method: "POST", body: formData });
                if (res.ok) {
                    msg.innerText = "✅ Record Successfully Updated!";
                    msg.style.color = "green";
                    fetchStudent();
                } else throw new Error();
            } catch (err) {
                msg.innerText = "❌ Error saving record.";
                msg.style.color = "red";
            }
        }
    </script>
</body>
</html>
